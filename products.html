<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Products | Tapas Mobile Care</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="js/data.js"></script>
    <script src="js/main.js?v=3"></script>
    <script>tailwind.config = tailwindConfig;</script>
    <style>
        .reveal { opacity: 0; transform: translateY(20px); transition: all 0.6s ease-out; }
        .reveal.active { opacity: 1; transform: translateY(0); }
    </style>
</head>
<body class="bg-white text-primary font-sans antialiased overflow-x-hidden pt-20">

    <!-- Page Header -->
    <div class="bg-primary text-white py-12 md:py-20 relative overflow-hidden">
        <div class="absolute inset-0 bg-[radial-gradient(ellipse_at_top_right,_var(--tw-gradient-stops))] from-slate-800 to-primary opacity-80"></div>
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 relative z-10">
            <h1 class="text-4xl md:text-5xl font-black mb-4 tracking-tight">Our Catalog</h1>
            <p class="text-gray-400 max-w-2xl text-lg font-medium">Browse our complete collection of premium smartphones, laptops, and accessories.</p>
        </div>
    </div>

    <!-- Main Content -->
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12 flex flex-col md:flex-row gap-8">
        
        <!-- Sidebar Filters -->
        <aside class="w-full md:w-64 shrink-0">
            <div class="bg-surface rounded-2xl p-6 border border-gray-100 sticky top-28 shadow-xl">
                <h3 class="font-bold text-lg mb-6 flex items-center gap-2"><i class="fas fa-filter text-accent"></i> Filters</h3>
                
                <div class="mb-6">
                    <label class="block text-sm font-bold text-primary mb-2">Search</label>
                    <input type="text" id="search-input" placeholder="e.g. iPhone 15..." class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-accent/50 focus:border-accent transition-all font-medium">
                </div>

                <div class="mb-6">
                    <label class="block text-sm font-bold text-primary mb-3">Category</label>
                    <div class="space-y-3" id="category-filters">
                        <label class="flex items-center gap-3 cursor-pointer group">
                            <input type="radio" name="category" value="all" checked class="w-4 h-4 text-accent accent-accent bg-gray-100 border-gray-300">
                            <span class="text-sm font-medium text-secondary group-hover:text-accent transition-colors">All Categories</span>
                        </label>
                        <label class="flex items-center gap-3 cursor-pointer group">
                            <input type="radio" name="category" value="Smartphones" class="w-4 h-4 text-accent accent-accent bg-gray-100 border-gray-300">
                            <span class="text-sm font-medium text-secondary group-hover:text-accent transition-colors">Smartphones</span>
                        </label>
                        <label class="flex items-center gap-3 cursor-pointer group">
                            <input type="radio" name="category" value="Laptops & Computers" class="w-4 h-4 text-accent accent-accent bg-gray-100 border-gray-300">
                            <span class="text-sm font-medium text-secondary group-hover:text-accent transition-colors">Laptops</span>
                        </label>
                        <label class="flex items-center gap-3 cursor-pointer group">
                            <input type="radio" name="category" value="Accessories" class="w-4 h-4 text-accent accent-accent bg-gray-100 border-gray-300">
                            <span class="text-sm font-medium text-secondary group-hover:text-accent transition-colors">Accessories</span>
                        </label>
                    </div>
                </div>

                <div class="mb-6">
                    <label class="block text-sm font-bold text-primary mb-3">Brand</label>
                    <select id="brand-select" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-accent/50 font-medium">
                        <option value="all">All Brands</option>
                        <option value="Apple">Apple</option>
                        <option value="Samsung">Samsung</option>
                        <option value="OnePlus">OnePlus</option>
                        <option value="HP">HP</option>
                        <option value="Dell">Dell</option>
                        <option value="Lenovo">Lenovo</option>
                        <option value="Realme">Realme</option>
                        <option value="Vivo">Vivo</option>
                        <option value="OPPO">OPPO</option>
                    </select>
                </div>

                <button id="reset-filters" class="w-full bg-gray-100 hover:bg-gray-200 text-primary py-3 rounded-xl text-sm font-bold transition-colors">
                    Reset Filters
                </button>
            </div>
        </aside>

        <main class="flex-grow">
            <div class="flex justify-between items-center mb-6">
                <p class="text-secondary text-sm font-medium" id="results-count">Showing 20 products</p>
                <div class="flex items-center gap-2">
                    <span class="text-sm font-bold text-primary">Sort:</span>
                    <select class="bg-surface border border-gray-200 rounded-lg px-3 py-1.5 text-sm focus:outline-none font-medium shadow-sm">
                        <option>Recommended</option>
                        <option>Newest Arrivals</option>
                    </select>
                </div>
            </div>

            <!-- Grid -->
            <div id="catalog-grid" class="grid grid-cols-2 sm:grid-cols-3 xl:grid-cols-4 gap-6">
                <!-- Products injected here -->
            </div>
            
            <!-- Empty State -->
            <div id="empty-state" class="hidden flex-col items-center justify-center py-20 text-center">
                <i class="fas fa-search text-4xl text-gray-300 mb-4"></i>
                <h3 class="text-lg font-bold text-primary mb-2">No products found</h3>
                <p class="text-secondary font-medium">Try adjusting your filters or search term.</p>
            </div>
        </main>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const grid = document.getElementById('catalog-grid');
            const searchInput = document.getElementById('search-input');
            const categoryRadios = document.querySelectorAll('input[name="category"]');
            const brandSelect = document.getElementById('brand-select');
            const resultsCount = document.getElementById('results-count');
            const emptyState = document.getElementById('empty-state');
            const resetBtn = document.getElementById('reset-filters');

            function renderProducts(filteredProducts) {
                if(filteredProducts.length === 0) {
                    grid.innerHTML = '';
                    emptyState.classList.remove('hidden');
                    emptyState.classList.add('flex');
                    resultsCount.textContent = '0 products found';
                    return;
                }
                
                emptyState.classList.add('hidden');
                emptyState.classList.remove('flex');
                
                let html = '';
                filteredProducts.forEach(p => {
                    let cardHtml = createProductCard(p);
                    cardHtml = cardHtml.replace('reveal', 'opacity-100 translate-y-0'); 
                    html += cardHtml;
                });
                grid.innerHTML = html;
                resultsCount.textContent = `Showing ${filteredProducts.length} product${filteredProducts.length > 1 ? 's' : ''}`;
            }

            function filterData() {
                const term = searchInput.value.toLowerCase();
                const selectedCat = document.querySelector('input[name="category"]:checked').value;
                const selectedBrand = brandSelect.value;

                const filtered = products.filter(p => {
                    const matchSearch = p.name.toLowerCase().includes(term) || p.brand.toLowerCase().includes(term);
                    const matchCat = selectedCat === 'all' || p.category === selectedCat;
                    const matchBrand = selectedBrand === 'all' || p.brand === selectedBrand;
                    return matchSearch && matchCat && matchBrand;
                });
                renderProducts(filtered);
            }

            searchInput.addEventListener('input', filterData);
            categoryRadios.forEach(r => r.addEventListener('change', filterData));
            brandSelect.addEventListener('change', filterData);
            
            resetBtn.addEventListener('click', () => {
                searchInput.value = '';
                document.querySelector('input[name="category"][value="all"]').checked = true;
                brandSelect.value = 'all';
                filterData();
            });

            if(typeof products !== 'undefined') {
                const urlParams = new URLSearchParams(window.location.search);
                const catParam = urlParams.get('category');
                if(catParam) {
                    const radio = document.querySelector(`input[name="category"][value="${catParam}"]`);
                    if(radio) radio.checked = true;
                }
                filterData();
            }
        });
    </script>
</body>
</html>
