<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Details | Tapas Mobile Care</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="js/data.js"></script>
    <script src="js/main.js?v=3"></script>
    <script>tailwind.config = tailwindConfig;</script>
</head>
<body class="bg-white text-primary font-sans antialiased overflow-x-hidden pt-20 flex flex-col min-h-screen">

    <main class="flex-grow max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12 w-full" id="product-container">
        <!-- Loading State -->
        <div class="flex items-center justify-center py-32" id="loading-state">
            <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-accent"></div>
        </div>
        
        <!-- Error State -->
        <div class="hidden flex-col items-center justify-center py-32 text-center" id="error-state">
            <i class="fas fa-exclamation-triangle text-5xl text-red-400 mb-6 drop-shadow-md"></i>
            <h2 class="text-3xl font-black text-primary mb-2 tracking-tight">Product Not Found</h2>
            <p class="text-secondary font-medium mb-8">The product you are looking for does not exist or has been removed.</p>
            <a href="products.html" class="bg-primary text-white px-8 py-4 rounded-xl font-bold hover:bg-black shadow-lg">Browse All Products</a>
        </div>

        <!-- Product Render Area -->
        <div class="hidden" id="product-content">
            <nav class="text-sm font-bold text-secondary mb-10 flex items-center gap-2">
                <a href="index.html" class="hover:text-accent transition-colors">Home</a> <i class="fas fa-chevron-right text-[10px] opacity-50"></i>
                <a href="products.html" class="hover:text-accent transition-colors" id="bc-cat">Category</a> <i class="fas fa-chevron-right text-[10px] opacity-50"></i>
                <span class="text-primary" id="bc-name">Product Name</span>
            </nav>

            <div class="flex flex-col lg:flex-row gap-12 lg:gap-20">
                <div class="lg:w-1/2">
                    <div class="bg-white rounded-3xl p-10 border border-gray-100 shadow-xl flex items-center justify-center aspect-square relative group">
                        <div class="absolute inset-0 bg-gradient-to-br from-gray-50 to-white rounded-3xl opacity-50"></div>
                        <span id="p-badge" class="hidden absolute top-6 left-6 bg-primary text-white text-xs font-black px-4 py-1.5 rounded-full z-10 tracking-widest uppercase shadow-md">Badge</span>
                        <img id="p-image" src="" alt="Product" class="max-w-full max-h-full object-contain drop-shadow-2xl relative z-10 transform group-hover:scale-105 transition-transform duration-500">
                    </div>
                </div>

                <div class="lg:w-1/2 flex flex-col justify-center">
                    <div class="mb-8 border-b border-gray-200 pb-8">
                        <p id="p-brand" class="text-accent font-black tracking-widest uppercase mb-2 text-sm">Brand</p>
                        <h1 id="p-name" class="text-4xl md:text-6xl font-black text-primary mb-4 leading-tight tracking-tight">Product Name</h1>
                        <p id="p-price" class="text-3xl text-secondary font-bold">Enquire for Price</p>
                    </div>

                    <div class="mb-10">
                        <h3 class="font-black text-primary mb-4 text-xl tracking-tight">Key Features</h3>
                        <p id="p-features" class="text-secondary font-medium leading-relaxed mb-6 text-lg">Features description</p>
                        
                        <ul id="p-specs" class="space-y-3 mt-4 bg-white p-6 rounded-2xl border border-gray-100 shadow-sm">
                            <!-- Specs injected here -->
                        </ul>
                    </div>

                    <div class="flex flex-col sm:flex-row gap-4 mt-auto">
                        <button id="p-cart-btn" class="flex-1 bg-primary hover:bg-black text-white px-8 py-4 rounded-xl font-bold text-center transition-all flex items-center justify-center gap-3 shadow-xl">
                            <i class="fas fa-cart-plus text-xl"></i> Add to Cart
                        </button>
                        <a id="p-wa-btn" href="#" target="_blank" class="flex-1 bg-[#25D366] hover:bg-[#1DA851] text-white px-8 py-4 rounded-xl font-bold text-center transition-all flex items-center justify-center gap-3 shadow-xl shadow-[#25D366]/30">
                            <i class="fab fa-whatsapp text-xl"></i> Inquiry
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const productId = urlParams.get('id');
            const loadingState = document.getElementById('loading-state');
            const errorState = document.getElementById('error-state');
            const contentState = document.getElementById('product-content');

            if(!productId || typeof products === 'undefined') {
                loadingState.classList.add('hidden');
                errorState.classList.remove('hidden');
                return;
            }

            const product = products.find(p => p.id === productId);

            if(!product) {
                loadingState.classList.add('hidden');
                errorState.classList.remove('hidden');
                return;
            }

            document.title = `${product.name} | Tapas Mobile Care`;
            document.getElementById('bc-cat').textContent = product.category;
            document.getElementById('bc-cat').href = `products.html?category=${encodeURIComponent(product.category)}`;
            document.getElementById('bc-name').textContent = product.name;
            document.getElementById('p-image').src = product.image;
            document.getElementById('p-image').alt = product.name;
            
            if(product.badge) {
                const badge = document.getElementById('p-badge');
                badge.textContent = product.badge;
                badge.classList.remove('hidden');
            }

            document.getElementById('p-brand').textContent = product.brand;
            document.getElementById('p-name').textContent = product.name;
            document.getElementById('p-price').textContent = product.price;
            document.getElementById('p-features').textContent = product.features;
            
            const specsList = document.getElementById('p-specs');
            specsList.innerHTML = product.specs.map(spec => `
                <li class="flex items-center gap-3 text-sm font-bold text-primary">
                    <div class="w-6 h-6 rounded-full bg-accent/10 flex items-center justify-center text-accent shrink-0"><i class="fas fa-check text-[10px]"></i></div> <span>${spec}</span>
                </li>
            `).join('');

            document.getElementById('p-wa-btn').href = generateWhatsAppLink(product.name);
            document.getElementById('p-cart-btn').onclick = () => addToCart(product.id);

            loadingState.classList.add('hidden');
            contentState.classList.remove('hidden');
        });
    </script>
</body>
</html>
